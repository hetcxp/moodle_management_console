name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Frontend Tests, Coverage & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Vitest Suite with Coverage Gates
        run: npm run test:coverage

      - name: Verify API Contract Parity
        run: python3 scripts/test_api_contract.py

      - name: Build Moodle UI Bundle
        run: npm run build:moodle

  backend:
    name: PHP Lint & Syntax Check (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, sodium, zip

      - name: Lint all PHP files
        run: |
          find plugin cli -type f -name "*.php" -exec php -l {} +

  moodle-phpunit:
    name: Moodle PHPUnit Test Suite (PHP 8.3)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodlepassword
          POSTGRES_DB: moodletest
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, sodium, zip, pgsql, pdo_pgsql, xml, gd, intl, soap
          ini-values: max_input_vars=5000

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ~/moodle-plugin-ci ^4
          echo "$HOME/moodle-plugin-ci/bin" >> $GITHUB_PATH

      - name: Install Moodle & Plugin
        env:
          MOODLE_BRANCH: MOODLE_405_STABLE
        run: |
          moodle-plugin-ci install --plugin plugin/management_console --branch MOODLE_405_STABLE --db-type pgsql --db-host 127.0.0.1 --db-port 5432 --db-user moodle --db-pass moodlepassword --db-name moodletest

      - name: Run PHPUnit Test Suite
        run: |
          moodle-plugin-ci phpunit
